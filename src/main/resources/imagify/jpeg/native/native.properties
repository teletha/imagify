# The GitHub release the jpegli shared libraries are published under and the runtime fetches from.
# The tag is the single source of truth: the jpegli-natives workflow publishes under exactly this
# tag and refuses to publish it twice, and a rebuild of the same jpegli version is published under
# a dash suffix (jpegli-natives-0.12.0-2) with this file bumped to match in the same commit.
tag = jpegli-natives-0.12.0
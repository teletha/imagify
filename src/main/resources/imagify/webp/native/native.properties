# The GitHub release the WebP shared libraries are published under and the runtime fetches from.
# The tag is the single source of truth: the webp-natives workflow publishes under exactly this
# tag and refuses to publish it twice, and a rebuild of the same libwebp version is published under
# a dash suffix (webp-natives-1.6.0-2) with this file bumped to match in the same commit.
tag = webp-natives-1.6.0
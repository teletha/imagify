# The GitHub release the imagifyavif shared library is published under and the runtime fetches
# from. The tag is the single source of truth: the avif-natives workflow publishes under exactly
# this tag and refuses to publish it twice, and a rebuild of the same libavif version is published
# under a dash suffix (avif-natives-1.4.2-2) with this file bumped to match in the same commit.
tag = avif-natives-1.4.2
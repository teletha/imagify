name: jpegli-natives

# Builds the jpegli shared libraries and publishes them under the immutable tag that
# src/main/resources/imagify/jpeg/native/native.properties names, which is also the tag the runtime
# fetches them from. See that directory's README.md.
#
#   gh workflow run jpegli-natives.yml
#
# The release is published once: republishing an existing tag fails on purpose, and a rebuild of the
# same jpegli version is published under the same tag plus a dash suffix.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # jpegli publishes neither tags nor releases, so there is nothing to pin a version to and the
  # commit is the only thing that can be pinned. The version beside it is jpegli/lib/CMakeLists.txt's
  # own JPEGLI_LIBRARY_VERSION at that commit, and the two are only ever meaningful together: it is
  # reported by JpegliCodec.getVersion() and ends up in a bug report, which is no use if it names a
  # different revision than the one that was built.
  JPEGLI_COMMIT: 031a0077f5799a6041004267fc12b956c1f52a20
  JPEGLI_VERSION: 0.12.0

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64,  os: windows-2022,      ext: dll,   arch: x64 }
          - { target: windows-arm64, os: windows-11-arm,    ext: dll,   arch: arm64 }
          - { target: linux-x64,    os: ubuntu-24.04,      ext: so }
          - { target: linux-arm64,  os: ubuntu-24.04-arm,  ext: so }
          - { target: macos-x64,    os: macos-15-intel,    ext: dylib }
          - { target: macos-arm64,  os: macos-14,          ext: dylib }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check out jpegli
        # submodules: recursive, and not optional. highway is a hard dependency that the jpegli
        # configure refuses to continue without, and Little-CMS is one too even though nothing here
        # links it: jpegli always includes lib/jpegli_cms.cmake and third_party/CMakeLists.txt
        # FATAL_ERRORs on finding neither Little-CMS nor skcms. The rest of the submodules are only
        # for tools and tests, all of which are configured off.
        uses: actions/checkout@v4
        with:
          repository: google/jpegli
          ref: ${{ env.JPEGLI_COMMIT }}
          path: jpegli
          submodules: recursive

      - name: Install CMake and Ninja (Windows)
        # Chocolatey updates only the machine PATH while every step runs with the PATH the job
        # started with, so re-read the machine PATH to make either tool visible to the next step.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install --no-progress -y cmake ninja
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + $env:Path
          cmake --version
          ninja --version

      - name: Set up the MSVC environment (Windows)
        # Without a developer command prompt, CMake picks the MinGW GCC that ships in the runner
        # image, and a MinGW DLL imports libwinpthread-1.dll, which is not part of Windows. MSVC
        # with the static CRT below matches what the libavif build ships: KERNEL32 plus the C
        # runtime that Windows itself provides, and nothing else.
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Pin cl as the compiler (Windows)
        # msvc-dev-cmd puts cl on the PATH, but CMake would still prefer the cc or gcc it finds
        # first, which is MinGW here. Naming the compiler is the only portable way to say so.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "CC=cl" >> "$GITHUB_ENV"
          echo "CXX=cl" >> "$GITHUB_ENV"
          cl 2>&1 | head -1

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        # brew install exits non-zero on a runner that already has ninja, so the failure is expected
        # on some images and must not fail the step. Asking the binary for its version is what
        # actually decides, since `|| true` would swallow a genuine install failure as well.
        if: runner.os == 'macOS'
        run: |
          brew install ninja || true
          ninja --version

      - name: Check the version the build will report
        # The version is written in native/jpegli/CMakeLists.txt and nowhere on a command
        # line, because a value on a command line is a value a shell can take apart. This step is
        # what stops the copy in the workflow and the copy the build reads from drifting apart when
        # JPEGLI_COMMIT is bumped above without editing the CMakeLists.
        run: python .github/scripts/check-codec-version.py jpegli "${{ env.JPEGLI_VERSION }}"

      - name: Configure
        # native/jpegli is an overlay rather than a fork of jpegli's build: jpegli only declares
        # its libjpeg62 compatible target where the linker understands a version script, which
        # excludes Windows and macOS, and the overlay re-declares it for all three with whatever the
        # local linker does understand. See the comments in that CMakeLists.txt.
        #
        # Everything else is jpegli's own configure, with its own libjpeg target turned off because
        # that is the one being replaced, and highway linked in statically: a shared library loaded
        # by absolute path out of a temporary directory cannot be counted on to find a sibling.
        #
        # The version is not passed in, because a workflow step with no shell: key runs under pwsh on
        # a Windows runner and PowerShell hands a native command -DIMAGIFY_JPEGLI_VERSION=0.12.0 as
        # two arguments, -DIMAGIFY_JPEGLI_VERSION=0 and .12.0. cmake keeps the 0, which is falsy, so
        # the fallback below runs instead and every Windows jpegli this project has built has
        # reported JpegliCodec.getVersion() as a commit hash rather than as 0.12.0. The value lives in
        # the CMakeLists, where a shell cannot reach it, and the step before checks the two agree.
        run: >
          cmake -S native/jpegli -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DIMAGIFY_JPEGLI_SOURCE_DIR=${{ github.workspace }}/jpegli

      - name: Build
        # imagify_jpegli is the shim plus the static jpegli and highway behind it. There is no
        # install step and no prefix: the result is loaded by absolute path, so nothing has to be
        # arranged around it.
        run: cmake --build build --target imagify_jpegli

      - name: Collect
        # One name pattern for every platform. CMake puts no prefix on a DLL, so the Windows output
        # is jpegli.dll and the others libjpegli.so and libjpegli.dylib; both spellings of the
        # Windows one are matched so that a change of prefix cannot turn into an empty result.
        # -type f skips the libjpegli.so.1.0.0 symlinks and copies the real file.
        shell: bash
        run: |
          mkdir -p dist
          src=$(find build -type f \( -name 'jpegli.dll' -o -name 'libjpegli.dll' \
            -o -name 'libjpegli.so' -o -name 'libjpegli.so.*' \
            -o -name 'libjpegli*.dylib' \) | head -1)
          test -n "$src" || { echo "::error::no jpegli shared library was produced under build/"; exit 1; }
          cp "$src" "dist/libjpegli-${{ matrix.target }}.${{ matrix.ext }}"
          ls -l dist

      - name: Reject a build with unfilled dependencies
        # The script reads the PE, ELF and Mach-O containers directly, so the same check runs
        # everywhere. objdump and otool are not present on the Windows runners and dumpbin needs an
        # MSVC environment, which used to make this step pass without ever looking at the library.
        run: python .github/scripts/check-self-contained.py "dist/libjpegli-${{ matrix.target }}.${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: libjpegli-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve the release tag
        # The tag is never assembled in this workflow: the one place it may live is the
        # native.properties inside the jar, which is also what every runtime reads to know where to
        # fetch from. It is a tag of the native libraries, not of imagify.
        id: tag
        run: |
          tag=$(sed -n 's/^tag *= *\(.*\)$/\1/p' src/main/resources/imagify/jpeg/native/native.properties)
          test -n "$tag" || { echo "::error::native.properties has no tag to publish"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check the tag against the pinned version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          expected="jpegli-natives-${{ env.JPEGLI_VERSION }}"
          [ "$TAG" = "$expected" ] || { echo "::error::native.properties says '$TAG' but the build pins jpegli ${{ env.JPEGLI_VERSION }} at ${{ env.JPEGLI_COMMIT }}, so it must be '$expected'"; exit 1; }

      - name: Refuse to republish an immutable tag
        # A release a client has already cached must never change under it, so a tag that exists is
        # a hard stop rather than an overwrite. A rebuild of the same version publishes under the
        # same tag plus a dash suffix and bumps native.properties in the same commit.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::the release $TAG already exists and is immutable. Bump the tag in native.properties (for example to ${TAG}-2), commit it, and run this workflow again."
            exit 1
          fi

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          overwrite_files: false
          body: |
            The `jpegli` shared libraries of `imagify`, built from jpegli ${{ env.JPEGLI_VERSION }} at
            `${{ env.JPEGLI_COMMIT }}`. jpegli publishes neither tags nor releases, so the commit is
            the pin.

            The jar fetches the file for the platform it runs on from this release, once, and caches
            it. The release is immutable, so publishing this tag again fails on purpose.
          files: dist/*

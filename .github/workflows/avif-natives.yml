name: avif-natives

# Builds the libavif shared libraries that ship inside the jar and attaches them to a rolling
# release named "avif-natives". See src/main/resources/imagify/avif/native/README.md.
#
#   gh workflow run avif-natives.yml
#
# Then drop the downloaded files into src/main/resources/imagify/avif/native/ and commit them.

on:
  workflow_dispatch:
  schedule:
    # Rebuild monthly so the bundled libavif tracks upstream security fixes.
    - cron: "37 5 1 * *"

permissions:
  contents: write

env:
  AVIF_VERSION: v1.4.2

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64,  os: windows-2022,      ext: dll,   arch: x64,   cpu: x86_64 }
          - { target: windows-arm64, os: windows-11-arm,    ext: dll,   arch: arm64, cpu: arm64 }
          - { target: linux-x64,    os: ubuntu-24.04,      ext: so,                 cpu: x86_64 }
          - { target: linux-arm64,  os: ubuntu-24.04-arm,  ext: so,                 cpu: arm64 }
          - { target: macos-x64,    os: macos-15-intel,    ext: dylib,              cpu: x86_64 }
          - { target: macos-arm64,  os: macos-14,          ext: dylib,              cpu: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check out libavif
        uses: actions/checkout@v4
        with:
          repository: AOMediaCodec/libavif
          ref: ${{ env.AVIF_VERSION }}
          path: libavif

      - name: Install CMake, Ninja and NASM (Windows)
        # NASM is installed on x64 only, and its absence on arm64 is deliberate. libaom treats an
        # assembler on the PATH as a go-ahead to build its x86 assembly sources, which on Windows
        # arm64 then fail to compile: immintrin.h rejects the target with "This header is specific
        # to X86, X64, ARM64, and ARM64EC targets". MSVC assembles the ARM64 sources itself, so
        # arm64 needs nothing extra. On x64 the NASM path does get used, and without an assembler
        # libaom stops at "Unable to find assembler. Install 'yasm' or 'nasm.'".
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $x64 = '${{ matrix.arch }}' -eq 'x64'
          $tools = if ($x64) { 'cmake', 'ninja', 'nasm' } else { 'cmake', 'ninja' }
          choco install --no-progress -y @tools
          # Chocolatey updates only the machine PATH, and a runner hands every step the PATH the
          # job started with, so neither CMake nor NASM reaches the configure step. Re-reading the
          # machine PATH is enough for CMake but not for NASM, which did not get there either, so
          # probe the layouts it can land in. Publish each tool's directory and stop loudly when
          # one is genuinely absent, rather than letting libaom report it much later.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + $env:Path

          function Get-ToolPath([string] $name, [string[]] $probeDirs, [string] $chocoLib) {
            $cmd = Get-Command $name -CommandType Application -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($cmd) { return $cmd.Source }
            $leaf = "$name.exe"
            $hit = $probeDirs | ForEach-Object { Join-Path $_ $leaf } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $hit -and $chocoLib) {
              $hit = Get-ChildItem $chocoLib -Filter $leaf -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($hit) { $hit = $hit.FullName }
            }
            if (-not $hit) { throw "$name is installed but no $leaf could be located" }
            return $hit
          }

          $found = @(Get-ToolPath 'cmake' @() $null)
          if ($x64) {
            $found += Get-ToolPath 'nasm' @('C:\Program Files\NASM', 'C:\Program Files (x86)\NASM') 'C:\ProgramData\chocolatey\lib\nasm'
          }
          foreach ($exe in $found) {
            Split-Path $exe | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "-> $exe"
          }

      - name: Set up the MSVC environment (Windows)
        # Without a developer command prompt, CMake picks the MinGW GCC that ships in the runner
        # image, and a MinGW DLL imports libwinpthread-1.dll, which is not part of Windows. MSVC
        # with the static CRT below matches what webp4j ships: KERNEL32 plus the C runtime that
        # Windows itself provides, and nothing else.
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Pin cl as the compiler (Windows)
        # msvc-dev-cmd puts cl on the PATH, but CMake would still prefer the cc or gcc it finds
        # first, which is MinGW here. Naming the compiler is the only portable way to say so.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "CC=cl" >> "$GITHUB_ENV"
          echo "CXX=cl" >> "$GITHUB_ENV"
          cl 2>&1 | head -1

      - name: Install Ninja and NASM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm

      - name: Install Ninja and NASM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja nasm

      - name: Configure
        # Every dependency is fetched and built in tree, so the result links nothing the user's
        # machine has to already provide. libyuv is not optional: AVIF_LIBYUV defaults to SYSTEM
        # and libavif aborts the configure when pkg-config cannot find it. SharpYUV is optional but
        # carries the fast RGB to YUV path the encoder wants.
        #
        # libaom alone covers both directions and is what libavif uses by default, so the other
        # codecs stay off. Each one that stays on also brings a build tool the runner images do
        # not reliably provide:
        #   dav1d is driven through Meson, and Meson lands outside PATH on Windows runners
        #          (Chocolatey installs it as an MSI, so the runner never sees the new PATH);
        #   rav1e is Rust, and the macOS arm64 image reinstalls rust-std underneath an in-flight
        #          cargo build, which breaks the link with missing .rlib files;
        #   SVT-AV1 hard-fails at enable_language(ASM_NASM) on x86 when NASM is absent.
        # Re-enabling one means installing the matching tool on all three platforms first.
        #
        # CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded is /MT rather than /MD. The default would leave
        # the library importing VCRUNTIME140.dll and MSVCP140.dll, which come from the Visual C++
        # redistributable rather than from Windows, so a user who has installed nothing would be
        # missing them. CMake ignores the variable on the Unix targets.
        #
        # AOM_TARGET_CPU is passed rather than left to libaom's own detection, which reads
        # CMAKE_SYSTEM_PROCESSOR. On Windows that comes from the environment, and the steps here
        # run under Git Bash, which is an x64 process even on the ARM64 image, so CMake reports
        # AMD64 and libaom announces "Detected CPU: x86_64". It then either demands NASM that
        # arm64 does not want, or compiles aom_dsp/x86 and fails in immintrin.h. Naming the target
        # also keeps the result from depending on which runner shell happens to be in use.
        # libavif sets this itself for macOS arm64, to the same value.
        run: >
          cmake -S libavif -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=ON
          -DAVIF_BUILD_APPS=OFF
          -DAVIF_BUILD_TESTS=OFF
          -DAVIF_LIBYUV=LOCAL
          -DAVIF_LIBSHARPYUV=LOCAL
          -DAVIF_CODEC_AOM=LOCAL
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DAOM_TARGET_CPU=${{ matrix.cpu }}

      - name: Build
        run: cmake --build build --target avif

      - name: Collect
        # One name pattern for every platform. The library is libavif.so.16 on Linux,
        # libavif.16.dylib on macOS, and libavif.dll on Windows, where CMake's lib prefix
        # applies to DLLs too. -type f skips the libavif.so symlink and copies the real file.
        shell: bash
        run: |
          mkdir -p dist
          src=$(find build -type f \( -name 'avif.dll' -o -name 'libavif.dll' \
            -o -name 'libavif.so' -o -name 'libavif.so.*' \
            -o -name 'avif*.dylib' -o -name 'libavif*.dylib' \) | head -1)
          test -n "$src" || { echo "::error::no libavif shared library was produced under build/"; exit 1; }
          cp "$src" "dist/libavif-${{ matrix.target }}.${{ matrix.ext }}"
          ls -l dist

      - name: Reject a build with unfilled dependencies
        # The script reads the PE, ELF and Mach-O containers directly, so the same check runs
        # everywhere. objdump and otool are not present on the Windows runners and dumpbin needs an
        # MSVC environment, which used to make this step pass without ever looking at the library.
        run: python .github/scripts/check-self-contained.py "dist/libavif-${{ matrix.target }}.${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: libavif-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: avif-natives
          name: avif-natives
          body: |
            Rolling build of the `libavif` shared libraries bundled in `imagify`, built from
            `${{ env.AVIF_VERSION }}`.

            Drop these files into `src/main/resources/imagify/avif/native/`.
          files: dist/*

name: avif-natives

# Builds the imagifyavif shared library and publishes it under the immutable tag that
# src/main/resources/imagify/avif/native/native.properties names, which is also the tag the runtime
# fetches it from. See that directory's README.md.
#
#   gh workflow run avif-natives.yml
#
# The release is published once: republishing an existing tag fails on purpose, and a rebuild of the
# same libavif version is published under the same tag plus a dash suffix.
#
# One file per platform, which is the same shape the libwebp shim has: libavif is compiled here as a
# static library and linked into the shim, so there is nothing beside it to resolve at run time. The
# earlier arrangement shipped libavif beside the shim and imported it, and the shim then recorded
# libavif's SONAME, which is a name the jar cannot ship because its files are named for the platform
# and the architecture. Three ways of renaming it were tried and all three fail; the reasoning is in
# native/avif/CMakeLists.txt.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  AVIF_VERSION: v1.4.2

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64,  os: windows-2022,     ext: dll,   arch: x64,   cpu: x86_64 }
          - { target: windows-arm64, os: windows-11-arm,   ext: dll,   arch: arm64, cpu: arm64 }
          - { target: linux-x64,    os: ubuntu-24.04,     ext: so,                 cpu: x86_64 }
          - { target: linux-arm64,  os: ubuntu-24.04-arm, ext: so,                 cpu: arm64 }
          - { target: macos-x64,    os: macos-15-intel,   ext: dylib,              cpu: x86_64 }
          - { target: macos-arm64,  os: macos-14,         ext: dylib,              cpu: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check out libavif
        uses: actions/checkout@v4
        with:
          repository: AOMediaCodec/libavif
          ref: ${{ env.AVIF_VERSION }}
          path: libavif

      - name: Install CMake, Ninja and NASM (Windows)
        # NASM is installed on x64 only, and its absence on arm64 is deliberate. libaom treats an
        # assembler on the PATH as a go-ahead to build its x86 assembly sources, which on Windows
        # arm64 then fail to compile: immintrin.h rejects the target with "This header is specific
        # to X86, X64, ARM64, and ARM64EC targets". MSVC assembles the ARM64 sources itself, so
        # arm64 needs nothing extra. On x64 the NASM path does get used, and without an assembler
        # libaom stops at "Unable to find assembler. Install 'yasm' or 'nasm.'".
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $x64 = '${{ matrix.arch }}' -eq 'x64'
          $tools = if ($x64) { 'cmake', 'ninja', 'nasm' } else { 'cmake', 'ninja' }
          choco install --no-progress -y @tools
          # Chocolatey updates only the machine PATH, and a runner hands every step the PATH the
          # job started with, so neither CMake nor NASM reaches the configure step. Re-reading the
          # machine PATH is enough for CMake but not for NASM, which did not get there either, so
          # probe the layouts it can land in. Publish each tool's directory and stop loudly when
          # one is genuinely absent, rather than letting libaom report it much later.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + $env:Path

          function Get-ToolPath([string] $name, [string[]] $probeDirs, [string] $chocoLib) {
            $cmd = Get-Command $name -CommandType Application -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($cmd) { return $cmd.Source }
            $leaf = "$name.exe"
            $hit = $probeDirs | ForEach-Object { Join-Path $_ $leaf } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $hit -and $chocoLib) {
              $hit = Get-ChildItem $chocoLib -Filter $leaf -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($hit) { $hit = $hit.FullName }
            }
            if (-not $hit) { throw "$name is installed but no $leaf could be located" }
            return $hit
          }

          $found = @(Get-ToolPath 'cmake' @() $null)
          if ($x64) {
            $found += Get-ToolPath 'nasm' @('C:\Program Files\NASM', 'C:\Program Files (x86)\NASM') 'C:\ProgramData\chocolatey\lib\nasm'
          }
          foreach ($exe in $found) {
            Split-Path $exe | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "-> $exe"
          }

      - name: Set up the MSVC environment (Windows)
        # Without a developer command prompt, CMake picks the MinGW GCC that ships in the runner
        # image, and a MinGW DLL imports libwinpthread-1.dll, which is not part of Windows. MSVC
        # with the static CRT below matches what webp4j ships: KERNEL32 plus the C runtime that
        # Windows itself provides, and nothing else.
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Pin cl as the compiler (Windows)
        # msvc-dev-cmd puts cl on the PATH, but CMake would still prefer the cc or gcc it finds
        # first, which is MinGW here. Naming the compiler is the only portable way to say so.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "CC=cl" >> "$GITHUB_ENV"
          echo "CXX=cl" >> "$GITHUB_ENV"
          cl 2>&1 | head -1

      - name: Install Ninja and NASM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm

      - name: Install Ninja and NASM (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja nasm

      - name: Configure libavif
        # A static libavif, because the shim links it in rather than importing it.
        #
        # BUILD_SHARED_LIBS=OFF makes libavif build an avif_static target that merges every LOCAL
        # dependency into one archive, so the shim links against libavif and finds libaom, libyuv and
        # sharpyuv inside it. The merge is what =LOCAL means for a static consumer, and it is why one
        # file per platform ships rather than one plus six side dependencies.
        #
        # Every dependency is fetched and built in tree, so the result links nothing the user's
        # machine has to already provide. libyuv is not optional: AVIF_LIBYUV defaults to SYSTEM
        # and libavif aborts the configure when pkg-config cannot find it. SharpYUV is optional but
        # carries the fast RGB to YUV path the encoder wants.
        #
        # libaom alone covers both directions and is what libavif uses by default, so the other
        # codecs stay off. Each one that stays on also brings a build tool the runner images do
        # not reliably provide:
        #   dav1d is driven through Meson, and Meson lands outside PATH on Windows runners
        #          (Chocolatey installs it as an MSI, so the runner never sees the new PATH);
        #   rav1e is Rust, and the macOS arm64 image reinstalls rust-std underneath an in-flight
        #          cargo build, which breaks the link with missing .rlib files;
        #   SVT-AV1 hard-fails at enable_language(ASM_NASM) on x86 when NASM is absent.
        # Re-enabling one means installing the matching tool on all three platforms first.
        #
        # CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded is /MT rather than /MD. The default would leave
        # the library importing VCRUNTIME140.dll and MSVCP140.dll, which come from the Visual C++
        # redistributable rather than from Windows, so a user who has installed nothing would be
        # missing them. CMake ignores the variable on the Unix targets.
        #
        # AOM_TARGET_CPU is passed rather than left to libaom's own detection, which reads
        # CMAKE_SYSTEM_PROCESSOR. On Windows that comes from the environment, and the steps here
        # run under Git Bash, which is an x64 process even on the ARM64 image, so CMake reports
        # AMD64 and libaom announces "Detected CPU: x86_64". It then either demands NASM that
        # arm64 does not want, or compiles aom_dsp/x86 and fails in immintrin.h. Naming the target
        # also keeps the result from depending on which runner shell happens to be in use.
        # libavif sets this itself for macOS arm64, to the same value.
        #
        # shell: bash is not optional. The default on a Windows runner is pwsh, which cannot read
        # the array below, and it fails with a ParserError three lines into the step and says
        # nothing about the cmake it never reached.
        shell: bash
        run: |
          args=(
            -S libavif -B build -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DBUILD_SHARED_LIBS=OFF
            -DAVIF_BUILD_APPS=OFF
            -DAVIF_BUILD_TESTS=OFF
            -DAVIF_LIBYUV=LOCAL
            -DAVIF_LIBSHARPYUV=LOCAL
            -DAVIF_CODEC_AOM=LOCAL
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
            "-DAOM_TARGET_CPU=${{ matrix.cpu }}"
          )
          cmake "${args[@]}"

      - name: Build libavif
        shell: bash
        run: cmake --build build --target avif_static

      - name: Configure the shim
        # imagify.avif.ffm is a C shim over libavif rather than a direct binding, for two reasons.
        #
        # One is a line of the FFM ABI: a heap segment, which is what a Java array becomes, cannot
        # be stored into a pointer-typed struct field, and avifRGBImage.pixels is exactly such a
        # field. An entry point that takes the pixels as its own argument, called with
        # Linker.Option.critical set, is what makes an encode possible without copying the image
        # first. See native/avif/imagify_avif.c.
        #
        # The other is the thirteen libavif structures. A direct FFM binding needs a hand written
        # MemoryLayout for each, and a struct whose fields are in the wrong order does not fail, it
        # returns a wrong picture. In C the compiler checks every field against the header it was
        # compiled with.
        #
        # IMAGIFY_AVIF_SOURCE_DIR is the libavif build tree and IMAGIFY_AVIF_HEADER_DIR the
        # checkout's include directory, because the two are not next to each other here.
        shell: bash
        run: >
          cmake -S native/avif -B shim-build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DIMAGIFY_AVIF_SOURCE_DIR=$PWD/build
          -DIMAGIFY_AVIF_HEADER_DIR=$PWD/libavif/include

      - name: Build the shim
        shell: bash
        run: cmake --build shim-build

      - name: Reject a build with unfilled dependencies
        # The script reads the PE, ELF and Mach-O containers directly, so the same check runs
        # everywhere. objdump and otool are not present on the Windows runners and dumpbin needs an
        # MSVC environment, which used to make this step pass without ever looking at the library.
        #
        # There is no allow list entry to add. The shim links libavif and libaom in, so what it brings
        # with it is the C and C++ runtimes, and those are already on the list: libstdc++ on Linux,
        # libc++ inside libSystem on macOS, and on Windows nothing at all under /MT.
        shell: bash
        run: |
          set -euo pipefail
          shim=""
          for candidate in "shim-build/imagifyavif.${{ matrix.ext }}" "shim-build/libimagifyavif.${{ matrix.ext }}"; do
            if [ -f "$candidate" ]; then shim="$candidate"; break; fi
          done
          test -n "$shim" || { echo "::error::no shim was produced under shim-build/"; exit 1; }
          mkdir -p dist
          # CMake puts no prefix on a DLL, so the two Unix targets produce libimagifyavif.so and
          # libimagifyavif.dylib where Windows produces imagifyavif.dll. The jar names them for the
          # platform and the architecture so that six of them sit in one directory.
          cp "$shim" "dist/imagifyavif-${{ matrix.target }}.${{ matrix.ext }}"
          ls -l dist
          python .github/scripts/check-self-contained.py "dist/imagifyavif-${{ matrix.target }}.${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: imagifyavif-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve the release tag
        # The tag is never assembled in this workflow: the one place it may live is the
        # native.properties inside the jar, which is also what every runtime reads to know where to
        # fetch from. It is a tag of the native libraries, not of imagify.
        id: tag
        run: |
          tag=$(sed -n 's/^tag *= *\(.*\)$/\1/p' src/main/resources/imagify/avif/native/native.properties)
          test -n "$tag" || { echo "::error::native.properties has no tag to publish"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check the tag against the pinned version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          expected="avif-natives-${AVIF_VERSION#v}"
          [ "$TAG" = "$expected" ] || { echo "::error::native.properties says '$TAG' but the build pins libavif ${{ env.AVIF_VERSION }}, so it must be '$expected'"; exit 1; }

      - name: Refuse to republish an immutable tag
        # A release a client has already cached must never change under it, so a tag that exists is
        # a hard stop rather than an overwrite. A rebuild of the same version publishes under the
        # same tag plus a dash suffix and bumps native.properties in the same commit.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::the release $TAG already exists and is immutable. Bump the tag in native.properties (for example to ${TAG}-2), commit it, and run this workflow again."
            exit 1
          fi

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          overwrite_files: false
          body: |
            The `imagifyavif` shared library of `imagify`, which contains `libavif` built from
            `${{ env.AVIF_VERSION }}` and linked in.

            The jar fetches the file for the platform it runs on from this release, once, and caches
            it. The release is immutable, so publishing this tag again fails on purpose.
          files: dist/*
